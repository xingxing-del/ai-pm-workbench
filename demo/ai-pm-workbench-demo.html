<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 产品工作台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
:root {
  --paper: #EEF1EE;
  --panel: #FFFFFF;
  --ink: #1E2A27;
  --muted: #5E6D68;
  --line: #CAD3CE;
  --teal: #1F5C66;
  --teal-soft: #DCE8E9;
  --go: #2C8656;
  --stop: #BF3A2F;
  --caution: #B57B0C;
  --caution-soft: #F6ECD6;
  --font: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131917; --panel: #1B2321; --ink: #E3EAE7; --muted: #94A39E; --line: #2F3B38;
    --teal: #6FB3BD; --teal-soft: #1F3236; --go: #4FB27D; --stop: #E0695E; --caution: #E0A93C; --caution-soft: #3A3020;
  }
}
:root[data-theme="dark"] {
  --paper: #131917; --panel: #1B2321; --ink: #E3EAE7; --muted: #94A39E; --line: #2F3B38;
  --teal: #6FB3BD; --teal-soft: #1F3236; --go: #4FB27D; --stop: #E0695E; --caution: #E0A93C; --caution-soft: #3A3020;
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--font); font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

.app { min-height: 100%; }

/* ---------- 顶栏 ---------- */
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 28px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; gap: 8px; align-items: center; }
.brand strong { font-size: 15px; white-space: nowrap; }
.brand-mark { width: 12px; display: grid; gap: 2px; padding: 3px 2px; background: var(--ink); border-radius: 3px; }
.brand-mark i { width: 8px; height: 8px; border-radius: 50%; background: #555; }
.brand-mark i:nth-child(1) { background: var(--stop); }
.brand-mark i:nth-child(3) { background: var(--go); }
.switch select { width: auto; max-width: 340px; padding: 6px 9px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.mode { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.mode-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--caution); }
.mode-dot.model { background: var(--go); }
.topbar .link { font-size: 13px; }

/* ---------- 通用 ---------- */
.btn { border: 1px solid transparent; border-radius: 6px; padding: 7px 14px; cursor: pointer; background: none; font-weight: 500; }
.btn.primary { background: var(--teal); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0F1716; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1716; } }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: var(--line); background: var(--panel); }
.btn.ghost:hover { border-color: var(--teal); }
.btn.danger { color: var(--stop); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.link { border: 0; background: none; color: var(--teal); padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.icon { border: 0; background: none; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; color: var(--muted); }
.icon:hover:not(:disabled) { background: var(--paper); color: var(--ink); }
.icon:disabled { opacity: .3; cursor: default; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.go { color: var(--go); border-color: currentColor; }
.tag.caution { color: var(--caution); border-color: currentColor; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.notice { background: var(--caution-soft); border-left: 3px solid var(--caution); padding: 8px 12px; margin: 8px 0; font-size: 14px; border-radius: 0 4px 4px 0; }
.fld { display: grid; gap: 4px; margin-bottom: 12px; }
.fld > span { font-size: 13px; color: var(--muted); }
input, select, textarea { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 6px 9px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }

/* ---------- 主区 ---------- */
.main { padding: 24px 28px 48px; min-width: 0; }
#header { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; }
#header h1 { font-size: 26px; font-weight: 700; }
.h-sub { margin: 4px 0 0; display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; align-items: center; }
.h-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- 阶段轨道：信号灯 ---------- */
#track { overflow-x: auto; margin: 0 -28px 24px; padding: 0 28px; }
.rail { list-style: none; margin: 0; padding: 8px 0 4px; display: grid; grid-template-columns: repeat(10, minmax(92px, 1fr)); position: relative; }
.station { position: relative; }
.station::before { content: ""; position: absolute; top: 25px; left: 0; right: 0; height: 3px; background: var(--line); }
.station:first-child::before { left: 50%; }
.station:last-child::before { right: 50%; }
.station.past::before, .station.current::before { background: var(--teal); }
.station.current::before { right: 50%; }
.station.current:last-child::before { right: 50%; }
.station > button { position: relative; width: 100%; border: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 4px 4px 8px; border-radius: 8px; }
.station > button:hover .st-name { color: var(--teal); }
.station.viewing > button::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 28px; height: 3px; margin-left: -14px; border-radius: 2px; background: var(--teal); }
.station.viewing .st-name { color: var(--teal); font-weight: 700; }
.node { width: 22px; height: 22px; margin: 6px 0 4px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--panel); border: 2px solid var(--line); color: var(--muted); }
.station.past .node, .station.current .node { border-color: var(--teal); color: var(--teal); }
.station.current .node { background: var(--teal); color: #fff; }
/* 关键节点是一盏信号灯 */
.station.key .node { width: 34px; height: 34px; margin: 0 0 0; font-size: 13px; border-width: 3px; background: var(--ink); color: #fff; border-color: var(--ink); }
.station.key .node.idle { background: #5b6662; border-color: var(--ink); }
.station.key .node.go { background: var(--go); border-color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--go) 22%, transparent); }
.station.key .node.stop { background: var(--stop); border-color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--stop) 25%, transparent); animation: blink 1.6s ease-in-out 2; }
.station.key .node.forced { background: var(--caution); border-color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--caution) 25%, transparent); }
@keyframes blink { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--stop) 8%, transparent); } }
@media (prefers-reduced-motion: reduce) { .station.key .node.stop { animation: none; } }
.st-name { font-size: 13px; text-align: center; line-height: 1.35; }
.station.current .st-name { font-weight: 700; }
.st-meta { font-size: 11px; color: var(--muted); }

/* ---------- 工作区 ---------- */
.work { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
.stage-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; }
.sp-head { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sp-head h2 { font-size: 20px; margin-right: 4px; }
.sp-desc { color: var(--muted); margin: 6px 0 4px; max-width: 70ch; }
.sec { font-size: 14px; color: var(--muted); font-weight: 500; margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.steps { list-style: none; margin: 0; padding: 0; }
.step { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.step-line { display: flex; align-items: center; gap: 10px; }
.step-line select { width: 86px; flex: none; padding: 3px 6px; font-size: 13px; }
.step-title { flex: 1; min-width: 0; }
.step.done .step-title { color: var(--muted); }
.step.done select { color: var(--go); }
.step.doing select { color: var(--teal); font-weight: 500; }
.step.skipped .step-title { text-decoration: line-through; color: var(--muted); }
.step-tools { display: flex; gap: 0; opacity: .55; }
.step:hover .step-tools, .step:focus-within .step-tools { opacity: 1; }
.step-risk { margin: 4px 0 0 96px; font-size: 13px; color: var(--caution); }
.step-peek { margin: 2px 0 0 96px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-more { margin: 8px 0 0 96px; }
.empty { color: var(--muted); padding: 8px 0; }
.addstep { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.addstep .btn { white-space: nowrap; }
.fields { max-width: 760px; }

.metrics { display: grid; gap: 6px; }
.m-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr .7fr 28px; gap: 6px; align-items: center; }
.m-head { font-size: 12px; color: var(--muted); }
.metrics > .btn { justify-self: start; margin-top: 4px; }
.results { display: grid; gap: 6px; }
.r-row { display: grid; grid-template-columns: 1fr 110px 64px; gap: 10px; align-items: center; }
.r-row small { display: block; color: var(--muted); font-size: 12px; }
.r-flag { font-size: 13px; color: var(--muted); }
.r-flag.go { color: var(--go); } .r-flag.stop { color: var(--stop); }

/* ---------- 决策台 ---------- */
.desk { display: grid; gap: 16px; position: sticky; top: 72px; }
.desk h3 { font-size: 15px; margin-bottom: 8px; }
.desk h4 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 14px 0 6px; }
.desk h4 small { font-weight: 400; margin-left: 6px; }
.next-text { font-size: 17px; font-weight: 500; margin: 0; }
.next .btn { margin-top: 10px; }
.session { border-color: var(--teal); }
.session.gate { border-width: 2px; }
.rules { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14px; }
.rules li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
.rules small { display: block; color: var(--muted); font-size: 12px; }
.rules .go .mark { color: var(--go); } .rules .stop .mark { color: var(--stop); font-weight: 700; }
.verdict { margin: 10px 0 0; font-weight: 700; }
.verdict.go { color: var(--go); } .verdict.stop { color: var(--stop); }
.advice { font-weight: 500; margin: 0 0 6px; }
.advice-reason { color: var(--muted); font-size: 14px; margin: 0; }
.alt-title { font-size: 13px; margin: 10px 0 2px; }
.alts { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.decide { display: flex; flex-wrap: wrap; gap: 8px; }
.loading { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .loading { animation: none; } }
.loglist { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
.loglist li { padding: 8px 0 8px 12px; border-left: 2px solid var(--line); font-size: 13px; }
.loglist li.log-force { border-left-color: var(--caution); }
.loglist li.log-gate { border-left-color: var(--teal); }
.loglist time { color: var(--muted); font-size: 12px; }
.loglist p { margin: 2px 0 0; }
.loglist b { margin-right: 6px; }
.log-sub { color: var(--muted); }
.log-reason { color: var(--caution); }

/* ---------- 项目材料 ---------- */
.count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--teal-soft); color: var(--teal); font-size: 12px; line-height: 20px; text-align: center; }
.h-actions label.btn { display: inline-flex; align-items: center; }
.mat-notice { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; margin: -4px 0 16px; }
.mat-notice .link { flex: none; font-size: 13px; }
.matdlg { width: min(760px, 92vw); max-height: 86vh; overflow-y: auto; }
dialog:has(.matdlg) { width: min(760px, 92vw); }
.mat-group { font-size: 13px; color: var(--muted); font-weight: 500; margin: 14px 0 6px; }
.mat-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.mat-items summary { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.mat-items summary:hover { border-color: var(--teal); }
.mi-name { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mat-items small { color: var(--muted); font-size: 12px; }
.mat-items .doc { margin: 6px 0 4px; }

/* ---------- 决策与依据 ---------- */
.decide-bar { position: sticky; bottom: -16px; margin: 12px -16px -16px; padding: 12px 16px 14px; background: var(--panel); border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; }
.decide-title { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.decide-bar .hint { margin-top: 8px; }
.danger-link { color: var(--stop); margin-left: 8px; font-size: 13px; }
.advice-more summary { cursor: pointer; font-size: 13px; color: var(--muted); margin: 4px 0; }
.rules.stale, .results.stale { opacity: .5; }
.status-card h3 { color: var(--muted); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn-row .btn { flex: 1; }
.snap-link { font-size: 12px; margin-top: 4px; }
.snapdlg { width: min(760px, 92vw); max-height: 86vh; overflow-y: auto; }
dialog:has(.snapdlg) { width: min(760px, 92vw); }
.snap-head { font-size: 15px; margin: 0; }
.snapdlg h4 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 16px 0 6px; }
.snapdlg h4 small { font-weight: 400; margin-left: 6px; }
.snap-head b { margin-right: 6px; }
.snap-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.snap-table th, .snap-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.snap-table th { color: var(--muted); font-weight: 500; font-size: 12px; }
.snap-table td.go { color: var(--go); } .snap-table td.stop { color: var(--stop); }
.evidence { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; font-size: 13px; }
.evidence .k { color: var(--muted); margin-right: 4px; }
.chip-sm { display: inline-flex; gap: 4px; align-items: center; padding: 2px 8px 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.link-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 50vh; overflow-y: auto; }
.link-list label { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.link-list input { width: auto; }
.link-list small { margin-left: auto; color: var(--muted); font-size: 12px; }
.fld > span small.ver { margin-left: 8px; color: var(--muted); font-size: 12px; }
.fld-num input { max-width: 180px; }
.warn { color: var(--caution) !important; }
.import-link { font-size: 13px; cursor: pointer; }

.warn-card { border-color: var(--caution); background: var(--caution-soft); }
.warn-card h3 { color: var(--caution); }
.warn-card .btn-row .btn { flex: none; }
details.more summary { cursor: pointer; color: var(--teal); font-size: 12px; margin-top: 4px; }
details.more .doc { margin-top: 6px; font-size: 13px; }
.snapdlg details.more p { margin: 6px 0; font-size: 13px; }

.export-opts { display: grid; gap: 10px; margin-bottom: 8px; }
.export-opt { display: grid; gap: 4px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
.export-opt:hover { border-color: var(--teal); background: var(--teal-soft); }
.export-opt b { font-size: 15px; }
.export-opt span { font-size: 13px; color: var(--muted); line-height: 1.6; }

.log-approver { color: var(--teal); }
.trend { margin-bottom: 4px; }
.trend:empty { display: none; }
.trend-title { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.trend-title small { margin-left: 8px; font-size: 12px; }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 4px; background: var(--panel); }
.tcard.stop { border-color: color-mix(in srgb, var(--stop) 45%, var(--line)); }
.tcard.go { border-color: color-mix(in srgb, var(--go) 45%, var(--line)); }
.tc-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; }
.tc-name { font-weight: 500; }
.tc-name small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.tc-val { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
.tc-val b { font-size: 22px; }
.tcard.stop .tc-val b { color: var(--stop); }
.tcard.go .tc-val b { color: var(--go); }
.tc-val small { font-size: 12px; color: var(--muted); }
.spark { width: 100%; height: auto; display: block; overflow: visible; }
.spark .thr { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; }
.spark .thr-t { fill: var(--muted); font-size: 10px; }
.spark .ln { fill: none; stroke: var(--teal); stroke-width: 2; }
.spark circle { stroke: var(--panel); stroke-width: 2; }
.spark circle.go { fill: var(--go); }
.spark circle.stop { fill: var(--stop); }
.spark circle.cur { stroke: var(--ink); stroke-dasharray: 2 2; }
.spark .pv { fill: var(--ink); font-size: 11px; font-weight: 700; }
.spark .px { fill: var(--muted); font-size: 10px; }

/* ---------- 项目日志 ---------- */
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.card-head h3 { margin: 0; }
.card-head .link { font-size: 13px; }
.logdlg { width: min(760px, 92vw); max-height: 86vh; display: flex; flex-direction: column; }
dialog:has(.logdlg) { width: min(760px, 92vw); }
.lognote { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 12px; }
.lognote .btn { white-space: nowrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.filter { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 2px 12px; cursor: pointer; font-size: 13px; }
.filter small { margin-left: 4px; color: var(--muted); }
.filter.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.filter.on small { color: inherit; opacity: .8; }
.timeline { list-style: none; margin: 0; padding: 4px 0 0; overflow-y: auto; }
.timeline li { padding: 10px 0 10px 14px; border-left: 2px solid var(--line); font-size: 14px; }
.timeline li.tl-gate, .timeline li.tl-next, .timeline li.tl-advance, .timeline li.tl-backflow, .timeline li.tl-create { border-left-color: var(--teal); }
.timeline li.tl-force { border-left-color: var(--caution); }
.timeline li.tl-note { border-left-color: var(--ink); }
.timeline p { margin: 2px 0 0; }
.timeline b { margin-right: 6px; }
.tl-meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }

/* ---------- 新建 ---------- */
.create { max-width: 980px; padding-bottom: 24px; }
.create h1 { font-size: 26px; }
.lead { color: var(--muted); max-width: 66ch; }
.file { display: inline-block; }
.analysis { margin: 16px 0; }
.an-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 10px; }
.an-grid .k { display: block; font-size: 12px; color: var(--muted); }
.an-grid b { font-size: 18px; }
.analysis h4 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 14px 0 6px; }
.missing { margin: 4px 0 0; padding-left: 18px; color: var(--caution); }
.decomp { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

.dstage li { display: flex; gap: 4px; }

.sticky { position: sticky; bottom: 0; background: var(--paper); padding: 14px 0; margin-top: 12px; border-top: 1px solid var(--line); }

.wmiss { border-left: 3px solid var(--caution); background: var(--caution-soft); border-radius: 0 6px 6px 0; padding: 10px 14px; font-size: 14px; }

.tstage.current .tnode { background: var(--teal); border-color: var(--teal); color: #fff; box-shadow: 0 0 0 4px var(--teal-soft); }

@media (min-width: 1081px) {

}
@media (min-width: 1081px) and (min-height: 620px) {

  .main.shell .rail { min-height: 100%; }
  .main.shell .station { flex: 1 0 auto; display: flex; align-items: center; }
  .main.shell .station > button { flex: 1; }
  .main.shell .desk { position: static; align-content: start; }
  .main.shell .stage-panel {
    background:
      linear-gradient(var(--panel) 30%, transparent) center top / 100% 40px no-repeat local,
      linear-gradient(transparent, var(--panel) 70%) center bottom / 100% 40px no-repeat local,
      radial-gradient(farthest-side at 50% 0, rgba(0,0,0,.10), transparent) center top / 100% 12px no-repeat scroll,
      radial-gradient(farthest-side at 50% 100%, rgba(0,0,0,.10), transparent) center bottom / 100% 12px no-repeat scroll,
      var(--panel);
  }

  .main.shell .fields > :last-child { margin-bottom: 0; }
}

/* ---------- 窄屏 ---------- */
@media (max-width: 1080px) {
  .work { grid-template-columns: 1fr; }
  .desk { position: static; }
}
@media (max-width: 760px) {
  .topbar { padding-left: 16px; padding-right: 16px; }
  .switch select { max-width: 200px; }
  .mat-body { grid-template-columns: 1fr; }
  .main { padding: 16px; }
  #track { margin: 0 -16px 16px; padding: 0 16px; }
  .an-grid { grid-template-columns: 1fr; }
  .m-row { grid-template-columns: 1fr 1fr; }
  .m-head { display: none; }
  .step-more, .step-risk, .step-peek { margin-left: 0; }
  .step-line { flex-wrap: wrap; }
}

        reason: `越线的指标：${metricFail.map(r => r.detail).join('；')}。护栏指标代表"不可接受的结果"，越线时继续放量风险最大。先按回滚方案控制影响，再回到构建阶段定位原因。`,

        alternatives: [{ stage: 4, desc: '如果问题出在方案本身（比如转人工规则设计不合理），回到第 4 阶段改方案并重新评审。' }]
      };
    }

    if (ctx.kind === 'gate' && n === 4 && fields.review === '不通过') {
      return { ...base, summary: '评审没通过，留在第 4 阶段修改方案后重新评审。', reason: '先把评审意见逐条记成遗留问题，判断哪些是方案问题、哪些是标准问题。如果争议集中在指标上，需要回到第 3 阶段。', suggestedStage: 4, alternatives: [{ stage: 3, desc: '如果争议在验收标准本身，回到第 3 阶段重新和业务方确认。' }] };
    }

    if (missingFill.length) {
      return {
        ...base,
        summary: `先留在第 ${n} 阶段，把缺的材料补齐。`,
        reason: `规则检查没通过的项：${missingFill.map(r => r.label).join('；')}。这些都是客观缺项，补齐后再推进。${n === 7 && missingFill.some(r => r.label.includes('第 3 阶段')) ? '验收标准没确认就做评测，等于没有判断依据。' : ''}`,
        suggestedStage: n,
        alternatives: []
      };
    }

    if (ctx.kind === 'backflow') return backflowAdvice(fields, base);

    // 非关卡：询问下一步
    const next = root.Rules.nextStep(p);
    if (next.kind === 'step') {
      return { ...base, summary: `继续当前阶段：${next.text}。`, reason: `第 ${n} 阶段还有未完成的步骤。${stageByN(n).desc}`, suggestedStage: n, alternatives: n === 5 ? [{ stage: 6, desc: '评测集构建和构建调试可以并行，人手够的话可以同时推进第 6 阶段。' }] : [] };
    }
    if (n === 10) return backflowAdvice(fields, base);
    return { ...base, summary: next.text + '。', reason: '当前阶段的步骤都已完成。', suggestedStage: next.kind === 'advance' ? n + 1 : n, alternatives: [] };
  }

  function backflowAdvice(fields, base) {
    const lines = (fields.failures || '').split('\n').filter(s => s.trim());
    const toEval = lines.some(l => /样本|没覆盖|新类型|新问题/.test(l));
    return {
      ...base,
      summary: toEval ? '回流到第 5 阶段，把新出现的失败类型加进评测集。' : '回流到第 6 阶段，针对线上失败调整构建。',
      reason: lines.length ? `已记录 ${lines.length} 条线上失败。${toEval ? '其中有评测集没覆盖到的新类型，先补评测集，下一轮评测才能发现同类问题。' : '这些失败属于已知类型，评测集已经覆盖，直接调构建更快。'}` : '还没有记录线上失败案例。建议先在本阶段补充，否则下一轮没有新的评测用例。',
      suggestedStage: toEval ? 5 : 6,
      alternatives: [{ stage: toEval ? 6 : 5, desc: toEval ? '如果时间紧，也可以先调构建，但同类问题下一轮评测时仍可能漏掉。' : '如果怀疑评测集覆盖不全，回到第 5 阶段补样本。' }]
    };
  }

  root.AI = AI;
})(window);

      (this.state.projects || []).forEach(p => root.Engine.ensure(p));

        const p = demoProject();
        this.state = { projects: [p], activeId: p.id };

    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.state)); this.saveFailed = false; }
      catch (e) {
        if (!this.saveFailed && this.onError) this.onError('保存失败：浏览器存储空间不足或不可用，刚才的修改只在本次页面里有效。请导出项目备份。');

    active() { return this.state.projects.find(p => p.id === this.state.activeId) || null; },
    add(p) { this.state.projects.unshift(p); this.state.activeId = p.id; this.save(); },
    remove(id) {
      this.state.projects = this.state.projects.filter(p => p.id !== id);

      this.save();

// 多文件解析：一次上传多个文件，统一转成纯文本。
// 文本类直接读取；Word 用 mammoth，PDF 用 pdf.js，都在第一次用到时才从 CDN 加载。
(function (root) {
  const TEXT_EXT = ['md', 'markdown', 'txt', 'csv', 'tsv', 'json', 'html', 'htm', 'yaml', 'yml'];
  const ACCEPT = [...TEXT_EXT, 'docx', 'pdf'].map(e => '.' + e).join(',');
  const MAX_CHARS = 20000; // 单个文件送给 AI 的最大字数

  const MAMMOTH = 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
  const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
  const PDF_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const PDF_CMAPS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/'; // 中文 PDF 常用的字符映射表

  const loaded = {};
  function loadScript(src) {
    if (!loaded[src]) {
      loaded[src] = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        const timer = setTimeout(() => { delete loaded[src]; reject(new Error('解析组件加载超时（需要联网）。可以改传 Markdown 或 TXT，或把内容粘贴到补充说明')); }, 15000);
        s.src = src; s.onload = () => { clearTimeout(timer); resolve(); };
        s.onerror = () => { clearTimeout(timer); delete loaded[src]; reject(new Error('解析组件加载失败（需要联网）。可以改传 Markdown 或 TXT，或把内容粘贴到补充说明')); };
        document.head.appendChild(s);
      });
    }
    return loaded[src];
  }

  const ext = name => (name.split('.').pop() || '').toLowerCase();
  const readText = f => f.text();

  async function readDocx(f) {
    await loadScript(MAMMOTH);
    const r = await root.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    return r.value;
  }

  async function readPdf(f) {
    await loadScript(PDFJS);
    const lib = root.pdfjsLib;
    lib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
    const pdf = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()), cMapUrl: PDF_CMAPS, cMapPacked: true, verbosity: 0 }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const c = await (await pdf.getPage(i)).getTextContent();
      pages.push(c.items.map(it => it.str + (it.hasEOL ? '\n' : '')).join(''));
    }
    return pages.join('\n');
  }

  // 返回 [{name, text, ok, error, truncated}]
  async function parseFiles(fileList) {
    const out = [];
    for (const f of Array.from(fileList)) {
      const e = ext(f.name);
      try {
        let text;
        if (TEXT_EXT.includes(e)) text = await readText(f);
        else if (e === 'docx') text = await readDocx(f);
        else if (e === 'pdf') text = await readPdf(f);
        else throw new Error('暂不支持这种格式');
        text = (text || '').replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
        if (!text) throw new Error('没有读到文字内容（可能是扫描件或图片）');
        const truncated = text.length > MAX_CHARS;
        out.push({ name: f.name, text: truncated ? text.slice(0, MAX_CHARS) : text, ok: true, truncated, chars: text.length });
      } catch (err) {
        out.push({ name: f.name, text: '', ok: false, error: err.message });
      }
    }
    return out;
  }

  root.Files = { parseFiles, ACCEPT, TEXT_EXT };
})(window);

        <li class="tl-${l.type}">
          <div class="tl-meta"><time>${fullTime(l.t)}</time><span class="tag">${groupOf(l.type)}</span><span>第 ${l.stage} 阶段</span></div>
          <p>${l.type === 'note' ? '' : `<b>${esc(l.stageName)}</b>`}${esc(l.decision)}</p>
          ${l.rule ? `<p class="log-sub">规则：${esc(l.rule)}</p>` : ''}
          ${l.ai ? `<p class="log-sub">AI：${esc(l.ai)}</p>` : ''}
          ${l.approver ? `<p class="log-approver">批准人：${esc(l.approver)}${l.opinion ? `　意见：${esc(l.opinion)}` : ''}</p>` : ''}
          ${l.before !== undefined ? `<div class="log-sub">修改前：${longText(l.before)}<br>修改后：${longText(l.after)}</div>` : ''}
          ${l.reason ? `<p class="log-reason">原因：${esc(l.reason)}</p>` : ''}
          ${l.snapshot ? `<button class="link snap-link" data-act="viewSnap" data-id="${esc(l.id)}">查看当时依据</button>` : ''}
        </li>`).join('') || '<li class="empty">这个分类下还没有记录。</li>'}</ol>
    </div>`;
    if (!dlg.open) { dlg.onclose = null; dlg.showModal(); }
  }

  // ---------- 原因弹窗 ----------
  function ask(title, desc, opts = {}) {
    return new Promise(resolve => {
      const dlg = $('#dialog');
      dlg.innerHTML = `
        <form method="dialog" class="dlg">
          <h3>${esc(title)}</h3>
          ${desc ? `<p class="dlg-desc">${esc(desc)}</p>` : ''}
          ${opts.select ? `<label class="fld"><span>${esc(opts.selectLabel || '选择')}</span><select id="dlgSelect">${opts.select.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select></label>` : ''}
          ${opts.input ? `<label class="fld"><span>${esc(opts.input.label)}</span><input id="dlgInput" value="${esc(opts.input.value || '')}" placeholder="${esc(opts.input.placeholder || '')}"></label>` : ''}
          <label class="fld"><span>${esc(opts.label || '原因')}</span>
            <textarea id="dlgText" rows="3" placeholder="${esc(opts.placeholder || '写清楚为什么，这条会进入决策记录')}"></textarea></label>
          <p class="dlg-err" id="dlgErr"></p>
          <div class="dlg-actions">
            <button value="cancel" class="btn ghost">取消</button>
            <button value="ok" class="btn primary" id="dlgOk">${esc(opts.ok || '确认')}</button>
          </div>
        </form>`;
      const done = v => { dlg.close(); resolve(v); };
      $('#dlgOk').onclick = e => {
        e.preventDefault();
        const text = $('#dlgText').value.trim();
        const input = opts.input ? $('#dlgInput').value.trim() : null;
        if (opts.input && opts.input.required && !input) { $('#dlgErr').textContent = `请填写${opts.input.label}。`; $('#dlgInput').focus(); return; }
        if (!text && !opts.optional) { $('#dlgErr').textContent = `请填写${opts.label || '原因'}。`; return; }
        done({ text, select: opts.select ? $('#dlgSelect').value : null, input });
      };
      dlg.onclose = null;
      setTimeout(() => { dlg.onclose = () => resolve(null); }, 0); // 避开上一个弹窗关闭时排队的 close 事件
      dlg.querySelector('[value=cancel]').onclick = e => { e.preventDefault(); done(null); };
      dlg.showModal();
      setTimeout(() => { const i = $('#dlgInput'); (i && !i.value ? i : $('#dlgText')).focus(); }, 30);
    });
  }

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
  }
